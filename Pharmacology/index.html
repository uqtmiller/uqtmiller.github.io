iazepines.", "B": "This option is incorrect because dental and bone loss are unrelated to GABAergic allosteric modulation.", "C": "This option is correct because prolonged benzodiazepine administration induces down-regulation of GABA-A receptors, leading to tolerance (requiring higher doses for the same effect), physical dependence, distressing withdrawal symptoms (rebound anxiety, insomnia, tremors, seizures if stopped abruptly), cognitive blunting, motor incoordination, and hip fractures from falls in older adults.", "D": "This option is incorrect because Australian and international clinical guidelines strictly advise limiting benzodiazepine use to 2 to 4 weeks for acute crises.", "E": "This option is incorrect because benzodiazepines have no antimicrobial properties and do not alter bacterial genetics."}}, {"id": 192, "category": "Anxiolytics, Benzodiazepines & Beta-Blockers", "topic": "Beta-Blockers in Anxiety (Propranolol)", "question": "What is the pharmacological mechanism and clinical indication of Beta-Blockers (such as propranolol) in the management of anxiety?", "options": ["A. They are beta-adrenergic receptor antagonists that blunt peripheral sympathetic autonomic arousal (reducing tachycardia, physical tremors, palpitations, and sweating), making them effective for situational performance anxiety (stage fright).", "B. They permanently paralyze the vocal cords to prevent speaking in public.", "C. They are potent GABA-A agonists that produce deep hypnosis and anesthesia.", "D. They act as irreversible inhibitors of monoamine oxidase.", "E. They cure generalized anxiety disorder by eradicating all cognitive worry thoughts in the cerebral cortex."], "correct_answer": "A", "explanations": {"A": "This option is correct because beta-blockers (like propranolol) antagonize peripheral beta-1 and beta-2 adrenergic receptors, blocking the cardiovascular and neuromuscular effects of adrenaline and noradrenaline; by preventing racing heart, shaky hands, voice tremor, and diaphoresis, they effectively manage the somatic symptoms of performance anxiety without causing sedation.", "B": "This option is incorrect because beta-blockers steady shaky motor tremor without producing neuromuscular vocal cord paralysis.", "C": "This option is incorrect because beta-blockers do not modulate GABA-A receptors and are not general anesthetics.", "D": "This option is incorrect because beta-blockers are adrenergic antagonists, not MAO inhibitors.", "E": "This option is incorrect because beta-blockers act peripherally and do not directly alleviate the central cognitive rumination or worry of generalized anxiety disorder."}}, {"id": 193, "category": "Anxiolytics, Benzodiazepines & Beta-Blockers", "topic": "What Beta-Blockers Do NOT Do", "question": "A patient with Generalized Anxiety Disorder is troubled primarily by catastrophic worry, obsessions, and racing anxious thoughts. Why are beta-blockers alone considered inadequate for this presentation?", "options": ["A. Beta-blockers cause instant permanent amnesia of all past life events.", "B. Beta-blockers can only be administered to patients under 12 years of age.", "C. Beta-blockers destroy all serotonin in the cerebral cortex within minutes.", "D. Beta-blockers turn into pure caffeine inside the brain.", "E. Beta-blockers primarily target peripheral somatic and autonomic symptoms (heart rate, tremor) and do not effectively treat the central cognitive symptoms (psychic anxiety, worry) of anxiety disorders."], "correct_answer": "E", "explanations": {"A": "This option is incorrect because standard therapeutic doses of beta-blockers do not cause dense retrograde amnesia.", "B": "This option is incorrect because beta-blockers are widely prescribed to adults for hypertension, angina, and performance anxiety.", "C": "This option is incorrect because beta-blockers do not catabolize or deplete central serotonin.", "D": "This option is incorrect because beta-blockers are synthetic adrenergic blockers tha ce prolonged comatose states.", "D": "This option is incorrect because memory reconsolidation blockade weakens emotional autonomic reactivity while leaving declarative, factual memory of the trauma intact.", "E": "This option is incorrect because propranolol modulates adrenergic receptors without destroying cortical brain tissue."}}, {"id": 195, "category": "Mood Stabilisers, Antipsychotics & Stimulants", "topic": "Lithium Mechanism of Action", "question": "Although the exact therapeutic mechanism of Lithium Carbonate remains incompletely understood, which molecular actions are recognized in the course slides?", "options": ["A. It acts on intracellular second messenger systems, reduces the effectiveness of G-proteins, and alters key enzymes (such as inositol monophosphatase and GSK-3) involved in signal transduction.", "B. It permanently destroys all dopamine D2 receptors in the hypothalamus.", "C. It selectively blocks the serotonin transporter (SERT) identical to fluoxetine.", "D. It directly opens ligand-gated chloride channels in skeletal muscle.", "E. It converts noradrenaline into pure melatonin in the pineal gland."], "correct_answer": "A", "explanations": {"A": "This option is correct because the course lecture notes explicitly state that lithium acts on post-receptor second messenger cascades: it attenuates excessive G-protein coupling, inhibits inositol monophosphatase (depleting free inositol in overactive neurons), and modulates glycogen synthase kinase-3 (GSK-3), producing neuroprotective and mood-stabilizing effects.", "B": "This option is incorrect because lithium does not destroy dopamine receptor proteins in the brain.", "C": "This option is incorrect because lithium is a monovalent inorganic cation, not a synthetic selective serotonin reuptake inhibitor.", "D": "This option is incorrect because opening chloride channels is the mechanism of ionotropic GABA-A receptors, not lithium.", "E": "This option is incorrect because lithium does not convert ca tic concentration of dopamine and noradrenaline?", "options": ["A. By permanently destroying the presynaptic axon terminal", "B. By acting as a pure agonist at GABA-A chloride channels", "C. By blocking all renal excretion of water", "D. By inducing dopamine release from vesicular pools into the cytoplasm, reversing the dopamine transporter (DAT) to pump dopamine out of the terminal, and stimulating noradrenaline release", "E. By converting all brain dopamine directly into acetylcholine"], "correct_answer": "D", "explanations": {"A": "This option is incorrect because therapeutic stimulant actions are reversible pharmacological transport modulations that do not destroy axonal structures.", "B": "This option is incorrect because amphetamines are central nervous system stimulants, not inhibitory GABA-A agonists.", "C": "This option is incorrect because amphetamines act on monoamine transporters rather than renal aquaporin channels.", "D": "This option is correct because Slide 290 explicitly explains that amphetamines increase synaptic dopamine through four mechanisms: (1) binding to the presynaptic membrane to promote vesicular release, (2) releasing free dopamine from storage vesicles into the terminal cytoplasm, (3) reversing the direction of the dopamine transporter (DAT) to efflux dopamine into the cleft, and (4) increasing noradrenaline release.", "E": "This option is incorrect because amphetamines modulate catecholamine transport without transforming dopamine into cholinergic neurotransmitters."}}, {"id": 200, "category": "Mood Stabilisers, Antipsychotics & Stimulants", "topic": "Psychostimulant Contraindications", "question": "According to the clinical prescribing guidelines in Slide 298, what are the primary medical contraindications to prescribing stimulant medications (such as dexamphetamine)?", "options": ["A. Consuming green vegetables and drinking tap water", "B. Pre-existing hypertension, history of cardiovascular disease, history of substance use disorders, active psychosis, and concurrent use of MAOIs", "C. Mild myopia (nearsightedness) and wearing eyeglasses", "D. Having type O positive blood", "E. There are zero contraindications to psychostimulant therapy"], "correct_answer": "B", "explanations": {"A": "This option is incorrect because healthy dietary nutrition is entirely safe during stimulant treatment.", "B": "This option is correct because Slide 298 explicitly lists the contraindications for dexamphetamine as: hypertension and cardiac disease (due to sympathomimetic tachycardia and blood pressure elevation), history of substance abuse (due to stimulant abuse potential and reinforcement), history of psychosis (stimulants can exacerbate or precipitate psychotic delusions), and concurrent use of MAOIs (risk of fatal hypertensive crisis).", "C": "This option is incorrect because standard refractive errors do not contraindicate stimulant therapy.", "D": "This option is incorrect because ABO blood group antigens do not influence stimulant pharmacodynamics.", "E": "This option is incorrect because stimulants are Schedule 8 controlled medications with well-defined medical contraindications."}}];

    function initializeExam() {
      const categoryMap = {};
      ALL_QUESTIONS.forEach(q => {

      const selected = [];
      const categories = Object.keys(categoryMap);

      // Select 2 from each of the 12 categories (24 total)
      categories.forEach(cat => {
        const shuffledCat = [...categoryMap[cat]].sort(() => Math.random() - 0.5);
        selected.push(...shuffledCat.slice(0, 2));
      });

      // Select 6 additional questions from remaining pool for exactly 30
      const selectedIds = new Set(selected.map(q => q.id));
      const remaining = ALL_QUESTIONS.filter(q => !selectedIds.has(q.id));
      const extra6 = remaining.sort(() => Math.random() - 0.5).slice(0, 6);
      extra6.forEach(q => selected.push(q));

      // Shuffle final 30 questions
      const finalShuffled = selected.sort(() => Math.random() - 0.5);

      // Initialize state for each question
      const answers = finalShuffled.map(q => ({
        questionId: q.id,
        // Learning Mode fields:
        eliminatedOptions: [],
        isCorrect: false,
        firstTrySuccess: false,
        attempts: 0,
        feedbackHistory: [],
        // Exam Mode field:
        selectedOption: null
      }));

      state.examQuestions = finalShuffled;
      state.currentIndex = 0;
      state.answers = answers;
      state.examCompleted = false;
      state.reviewMode = false;

      render();
    }

    function switchMode(newMode) {
      if (state.mode === newMode) return;

      const hasActivity = state.answers && state.answers.some(a => 
        a.selectedOption !== null || a.isCorrect || a.eliminatedOptions.length > 0
      );

      if (hasActivity) {
        const confirmMsg = newMode === 'exam' 
          ? "Switching to Strict Exam Mode will start a fresh 30-question exam with live feedback hidden. Continue?"
          : "Switching to Learning Mode will start a fresh 30-question exam with instant feedback and retries enabled. Continue?";
        if (!confirm(confirmMsg)) return;
      }

      state.mode = newMode;
      initializeExam();
    }

    function handleSelectOption(letter) {
      const currentQ = state.examQuestions[state.currentIndex];
      const qState = state.answers[state.currentIndex];

      if (state.mode === 'exam') {
        // Exam Mode: Single selection, no feedback
        qState.selectedOption = letter;
        render();
        return;
      }

      // Learning Mode: Instant feedback with retries
      if (qState.isCorrect || qState.eliminatedOptions.includes(letter)) return;

      const isAnsCorrect = (letter === currentQ.correct_answer);
      const explanation = currentQ.explanations[letter];

      if (isAnsCorrect) {
        qState.isCorrect = true;
        if (qState.attempts === 0) {
          qState.firstTrySuccess = true;
        }
        qState.attempts += 1;
        qState.feedbackHistory = [
          {
            option: letter,
            text: explanation,
            isCorrect: true
          },
          ...qState.feedbackHistory
        ];
      } else {
        qState.eliminatedOptions.push(letter);
        qState.attempts += 1;
        qState.feedbackHistory = [
          {
            option: letter,
            text: explanation,
            isCorrect: false
          },
          ...qState.feedbackHistory
        ];
      }

      render();
    }

    function handlePrevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function handleNextQuestion() {
      if (state.currentIndex + 1 < state.examQuestions.length) {
        state.currentIndex += 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(idx) {
      if (idx >= 0 && idx < state.examQuestions.length) {
        state.currentIndex = idx;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function handleFinishExam() {
      let unansweredCount = 0;
      if (state.mode === 'exam') {
        unansweredCount = state.answers.filter(a => !a.selectedOption).length;
      } else {
        unansweredCount = state.answers.filter(a => !a.isCorrect).length;
      }

      if (unansweredCount > 0) {
        const msg = state.mode === 'exam'
          ? `You have ${unansweredCount} unanswered question(s). Are you sure you want to finish and submit the exam?`
          : `You have ${unansweredCount} question(s) that have not been answered correctly yet. Are you sure you want to finish and view results?`;
        if (!confirm(msg)) return;
      }

      state.examCompleted = true;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

                    statusBadge = '<span class="badge badge-success">Correct on 1st Attempt</span>';
                  } else if (a.isCorrect) {
                    statusBadge = '<span class="badge badge-primary">Correct on Attempt #' + a.attempts + '</span>';
                  } else {
                    statusBadge = '<span class="badge badge-danger">Not Solved</span>';
                  }
                }

                return `
                  <div class="card" style="margin-bottom: 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
                      <span style="font-weight: 700;">Question ${i + 1} of ${totalQ}</span>
                      ${statusBadge}
                    </div>
                    <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem;">
                      ${q.category} &bull; ${q.topic}
                    </div>
                    <p style="font-weight: 600; margin-bottom: 0.85rem;">${q.question}</p>

                    ${state.mode === 'exam' && a.selectedOption ? `
                      <div style="margin-bottom: 0.5rem; font-size: 0.88rem; font-weight: 600; color: ${a.selectedOption === q.correct_answer ? '#166534' : '#991b1b'};">
                        Your Answer: Option ${a.selectedOption} ${a.selectedOption === q.correct_answer ? '✓' : '✕'}
                      </div>
                    ` : (state.mode === 'exam' ? `
                      <div style="margin-bottom: 0.5rem; font-size: 0.88rem; color: #64748b; font-style: italic;">
                        Your Answer: No option was selected
                      </div>
                    ` : '')}

                    <div style="padding: 0.85rem; background-color: #f8fafc; border-radius: 0.5rem; font-size: 0.88rem; border: 1px solid #e2e8f0;">
                      <div style="font-weight: 700; color: #166534; margin-bottom: 0.35rem;">
                        Correct Answer: Option ${q.correct_answer}
                      </div>
                      <p style="color: #334155;">${q.explanations[q.correct_answer]}</p>
                    </div>

                    <div style="margin-top: 0.75rem;">
                      <details style="font-size: 0.82rem; color: #475569; cursor: pointer;">
                        <summary style="font-weight: 600; color: var(--primary);">View all distractor rationales</summary>
                        <div style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.4rem;">
                          ${Object.keys(q.explanations).map(letter => `
                            <div style="padding: 0.4rem 0.6rem; background: ${letter === q.correct_answer ? '#f0fdf4' : '#ffffff'}; border: 1px solid #e2e8f0; border-radius: 0.35rem;">
                              <strong>Option ${letter}:</strong> ${q.explanations[letter]}
                            </div>
                          `).join('')}
                        </div>
                      </details>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        app.innerHTML = `
          <div class="container">
            ${modeBarHtml}
            ${scoreCardHtml}

            <div class="card">
              <h3 style="font-size: 1.15rem; margin-bottom: 1rem;">Topic Breakdown</h3>
              <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                  <thead>
                    <tr style="border-bottom: 2px solid #e2e8f0; text-align: left; color: #475569;">
                      <th style="padding: 0.5rem;">Category</th>
                      <th style="padding: 0.5rem; text-align: center;">Questions</th>
                      <th style="padding: 0.5rem; text-align: center;">${state.mode === 'exam' ? 'Correct' : 'First-Try Correct'}</th>
                      <th style="padding: 0.5rem; text-align: center;">Accuracy %</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${categoryRows}
                  </tbody>
                </table>
              </div>
            </div>

            ${reviewList}
          </div>
        `;
        return;
      }

      // ==========================================
      // ACTIVE EXAM QUESTION SCREEN
      // ==========================================
      const currentQ = state.examQuestions[state.currentIndex];
      const qState = state.answers[state.currentIndex] || {
        eliminatedOptions: [],
        isCorrect: false,
        attempts: 0,
        feedbackHistory: [],
        selectedOption: null
      };

      const progressPercent = Math.round(((state.currentIndex + 1) / totalQ) * 100);

      // Render options
      let optionsHtml = "";
      currentQ.options.forEach(optStr => {
        const letter = optStr.charAt(0);
        let btnClass = "option-btn";
        let disabledAttr = "";

        if (state.mode === 'exam') {
          // Exam Mode: Highlight selected option
          if (qState.selectedOption === letter) {
            btnClass += " selected";
          }
        } else {
          // Learning Mode: Green for correct, strikeout for eliminated
          const isThisCorrect = qState.isCorrect && letter === currentQ.correct_answer;
          const isEliminated = qState.eliminatedOptions.includes(letter);

          if (isThisCorrect) btnClass += " correct";
          else if (isEliminated) btnClass += " incorrect";

          if (qState.isCorrect || isEliminated) disabledAttr = "disabled";
        }

        optionsHtml += `
          <button class="${btnClass}" ${disabledAttr} onclick="handleSelectOption('${letter}')">
            <span class="option-letter">${letter}</span>
            <span style="flex: 1;">${optStr.slice(3)}</span>
          </button>
        `;
      });

      // Question Navigator Palette HTML
      const answeredCount = state.mode === 'exam'
        ? state.answers.filter(a => a.selectedOption !== null).length
        : state.answers.filter(a => a.isCorrect).length;

      const paletteHtml = `
        <div class="palette-card">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 0.25rem;">
            <span>Question Navigator</span>
            <span style="color: var(--primary);">${answeredCount} / ${totalQ} Done</span>
          </div>
          <div class="palette-grid">
            ${state.examQuestions.map((q, idx) => {
              const a = state.answers[idx];
              let pClass = "palette-btn";
              if (idx === state.currentIndex) pClass += " current";

              if (state.mode === 'exam') {
                if (a.selectedOption !== null) pClass += " answered";
              } else {
                if (a.isCorrect) pClass += " correct";
                else if (a.eliminatedOptions.length > 0) pClass += " attempted";
              }

              return `
                <button class="${pClass}" onclick="jumpToQuestion(${idx})" title="Go to question ${idx + 1}">
                  ${idx + 1}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Right Column Content based on Mode
      let rightColumnHtml = "";

      if (state.mode === 'exam') {
        // Exam Mode: Info Card + Palette + Submit button
        const isSelected = qState.selectedOption !== null;
        rightColumnHtml = `
          <div class="card sticky-margin" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem;">
              <h3 style="font-size: 1rem; font-weight: 700; color: #1e293b;">Exam Status</h3>
              <span class="badge badge-primary">Exam Mode</span>
            </div>

            <div style="padding: 0.85rem; background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 0.5rem; font-size: 0.85rem; color: #1e40af; margin-bottom: 1rem;">
              <strong>Strict Exam Protocol:</strong> Select one answer per question. Feedback and full explanations will be displayed after submitting your exam.
            </div>

            <div style="font-size: 0.85rem; margin-bottom: 0.5rem;">
              <strong>Current Question:</strong> 
              ${isSelected ? `<span style="color: #166534; font-weight: 700;">Option ${qState.selectedOption} Selected</span>` : '<span style="color: #dc2626;">Not yet answered</span>'}
            </div>

            <div style="margin-top: 1rem;">
              <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="handleFinishExam()">
                Submit Exam Now (${answeredCount}/${totalQ} Answered)
              </button>
            </div>

            ${paletteHtml}
          </div>
        `;
      } else {
        // Learning Mode: Explanations margin + Palette
        let marginContentHtml = "";
        if (qState.feedbackHistory.length === 0) {
          marginContentHtml = `
            <div class="margin-placeholder">
              <div style="font-size: 1.5rem; margin-bottom: 0.35rem;">💡</div>
              <p style="font-weight: 600; margin-bottom: 0.25rem;">Explanation Margin</p>
              <p style="font-size: 0.8rem;">
                Select an option on the left. If incorrect, the explanation eliminating that option will appear here so you can try again!
              </p>
            </div>
          `;
        } else {
          marginContentHtml = qState.feedbackHistory.map((item, idx) => `
            <div class="margin-explanation-item ${item.isCorrect ? 'correct' : 'incorrect'}">
              <div style="font-weight: 700; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem;">
                ${item.isCorrect 
                  ? '<span>✓</span> Option ' + item.option + ': Correct Answer!' 
                  : '<span>✕</span> Option ' + item.option + ': Incorrect — Eliminated'}
              </div>
              <p>${item.text}</p>
              ${!item.isCorrect && idx === 0 && !qState.isCorrect ? `
                <div style="margin-top: 0.5rem; font-size: 0.8rem; font-weight: 600; color: #b91c1c;">
                  ↳ Try another remaining option on the left!
                </div>
              ` : ''}
            </div>
          `).join('');
        }

        rightColumnHtml = `
          <div class="card sticky-margin" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem;">
              <h3 style="font-size: 1rem; font-weight: 700; color: #1e293b;">Explanation Margin</h3>
              <span style="font-size: 0.75rem; color: var(--muted);">
                ${qState.isCorrect ? 'Answer Found' : (qState.eliminatedOptions.length > 0 ? qState.eliminatedOptions.length + ' eliminated' : 'Awaiting Selection')}
              </span>
            </div>

            <div class="margin-panel">
              ${marginContentHtml}
            </div>

            ${paletteHtml}

            <div style="margin-top: 1rem;">
              <button class="btn btn-outline" style="width: 100%; font-size: 0.85rem; justify-content: center;" onclick="handleFinishExam()">
                Finish & View Results (${answeredCount}/${totalQ} Solved)
              </button>
            </div>
          </div>
        `;
      }

      // Top HUD Scores
      let hudScoresHtml = "";
      if (state.mode === 'exam') {
        hudScoresHtml = `
          <div style="display: flex; gap: 1.5rem;">
            <div style="text-align: right;">
              <div style="font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">
                Answered
              </div>
              <div style="font-size: 1.35rem; font-weight: 800; color: var(--primary);">
                ${answeredCount} / ${totalQ}
              </div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">
                Remaining
              </div>
              <div style="font-size: 1.35rem; font-weight: 800; color: var(--muted);">
                ${totalQ - answeredCount}
              </div>
            </div>
          </div>
        `;
      } else {
        const learningFirstTry = state.answers.filter(a => a.firstTrySuccess).length;
        const learningFinal = state.answers.filter(a => a.isCorrect).length;
        hudScoresHtml = `
          <div style="display: flex; gap: 1.5rem;">
            <div style="text-align: right;">
              <div style="font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">
                1st-Try Mastery
              </div>
              <div style="font-size: 1.35rem; font-weight: 800; color: var(--primary);">
                ${learningFirstTry} / ${totalQ}
              </div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">
                Final Solved
              </div>
              <div style="font-size: 1.35rem; font-weight: 800; color: var(--success);">
                ${learningFinal} / ${totalQ}
              </div>
            </div>
          </div>
        `;
      }

      // Navigation Bar (at bottom of question card)
      const isFirst = state.currentIndex === 0;
      const isLast = state.currentIndex + 1 >= totalQ;

      const navBarHtml = `
        <div class="nav-bar">
          <button class="btn btn-outline" onclick="handlePrevQuestion()" ${isFirst ? 'disabled' : ''}>
            &larr; Previous Question
          </button>

          <div style="font-size: 0.85rem; color: var(--muted); font-weight: 500;">
            Question ${state.currentIndex + 1} of ${totalQ}
          </div>

          <div style="display: flex; gap: 0.5rem;">
            ${!isLast ? `
              <button class="btn btn-primary" onclick="handleNextQuestion()">
                Next Question &rarr;
              </button>
            ` : `
              <button class="btn btn-success" onclick="handleFinishExam()">
                Finish & Submit Exam &check;
              </button>
            `}
          </div>
        </div>
      `;

      app.innerHTML = `
        <div class="container">
          ${modeBarHtml}

          <!-- Top Card: Header & Live HUD Scores -->
          <div class="card" style="padding: 1.25rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
              <div>
                <h1 style="font-size: 1.25rem; font-weight: 700;">Psychopharmacology Practice Exam</h1>
                <p style="font-size: 0.85rem; color: var(--muted);">
                  30 Balanced Questions across All 12 Syllabus Domains &bull; ${state.mode === 'learning' ? 'Learning Mode' : 'Exam Mode'}
                </p>
              </div>
              ${hudScoresHtml}
            </div>

            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted);">
              <span>Question ${state.currentIndex + 1} of ${totalQ}</span>
              <span>${state.mode === 'exam' 
                ? (qState.selectedOption ? 'Option ' + qState.selectedOption + ' selected' : 'No option selected yet') 
                : (qState.isCorrect ? '✓ Solved' : (qState.attempts > 0 ? qState.attempts + ' attempt(s)' : 'Not yet attempted'))}</span>
            </div>
          </div>

          <!-- 2-Column Grid: Left = Question & Options, Right = Margin Explanations / Navigator -->
          <div class="exam-layout-grid">
            <!-- Left Column: Question & Options Stack -->
            <div class="card" style="margin-bottom: 0;">
              <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap;">
                <span class="badge badge-primary">${currentQ.category}</span>
                <span class="badge badge-muted">${currentQ.topic}</span>
              </div>

              <h2 style="font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.25rem;">
                ${currentQ.question}
              </h2>

              <div class="options-vertical-list">
                ${optionsHtml}
              </div>

              ${navBarHtml}
            </div>

            <!-- Right Column: Sticky Margin for Explanations & Navigator -->
            ${rightColumnHtml}
          </div>
        </div>
      `;
    }

    // Start exam on load
    initializeExam();
  </script>
</body>
</html>
