    // --- COOKIE & STORAGE HELPERS ---
    function getStoredApiKey() {
      const match = document.cookie.match(new RegExp("(^| )gemini_api_key=([^;]+)"));
      if (match && match[2]) return decodeURIComponent(match[2]);
      try {
        const local = localStorage.getItem("terrain_gemini_api_key");
        if (local) return local;
      } catch (e) {}
      return "";
    }

    function storeApiKey(key) {
      const trimmed = key.trim();
      const maxAge = 60 * 60 * 24 * 365;
      document.cookie = `gemini_api_key=${encodeURIComponent(trimmed)}; path=/; max-age=${maxAge}; SameSite=Lax`;
      try {
        localStorage.setItem("terrain_gemini_api_key", trimmed);
      } catch (e) {}
    }

    function clearApiKey() {
      document.cookie = "gemini_api_key=; path=/; max-age=0; SameSite=Lax";
      try {
        localStorage.removeItem("terrain_gemini_api_key");
      } catch (e) {}
    }

    // ROBUST GEMINI CALLER WITH AUTOMATIC MODEL FALLBACK
    const GEMINI_MODELS = [
      "gemini-2.5-flash-lite",
      "gemini-flash-latest",
      "gemini-3.8-flash",
      "gemini-flash-lite-latest",
      "gemini-pro-latest"
    ];

    async function callGeminiApi(apiKey, prompt, jsonMode = true) {
      let lastErr = null;
      for (const model of GEMINI_MODELS) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`;
          const payload = {
            contents: [{ role: "user", parts: [{ text: prompt }] }],
            generationConfig: {
              temperature: jsonMode ? 0.5 : 0.7
            }
          };
          if (jsonMode) {
            payload.generationConfig.responseMimeType = "application/json";
          }

          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) return text;
          }

          // If model busy (503) or not found/deprecated (404), fall back to next model
          if (res.status === 404 || res.status === 503) {
            console.warn(`Model ${model} returned ${res.status}, retrying fallback model...`);
            continue;
          }

          const errBody = await res.text();
          if (res.status === 400 || res.status === 401 || res.status === 403) {
            throw new Error(`API key authorization issue (${res.status}): ${errBody}`);
          }
          lastErr = new Error(`Error with ${model} (${res.status}): ${errBody}`);
        } catch (e) {
          if (e.message && e.message.includes("API key authorization issue")) throw e;
          lastErr = e;
        }
      }
      throw lastErr || new Error("Failed to connect with any available Gemini model.");
    }

                                  </span>
                                ) : (
                                  <span className="px-2.5 py-1 rounded bg-stone-800 text-stone-400 text-xs shrink-0 font-mono">
                                    Reviewing...
                                  </span>
                                )}
                                <div className="min-w-0">
                                  <div className="text-xs font-bold text-stone-200 truncate">
                                    {att.question.sectionTitle}: {att.question.questionText}
                                  </div>
                                  <div className="text-[11px] text-stone-500 truncate">{att.timestamp}</div>
                                </div>
                              </div>
                              <span className="text-xs text-stone-500">{isExp ? "▲" : "▼"}</span>
                            </div>

                            {isExp && (
                              <div className="p-5 pt-0 space-y-4 border-t border-stone-800/80 animate-fadeIn">
                                <div className="text-xs text-stone-400 bg-stone-900/50 p-3 rounded-xl mt-4">
                                  <strong className="text-stone-300">Section Meaning: </strong>{att.question.statedMeaning}
                                </div>

                                <div className="space-y-1">
                                  <span className="text-[11px] font-bold text-stone-400 uppercase">Your Answer:</span>
                                  <div className="p-4 rounded-xl bg-stone-900 text-xs text-stone-200 whitespace-pre-wrap leading-relaxed">
                                    {att.studentAnswer}
                                  </div>
                                </div>

                                {att.isLoading && (
                                  <div className="p-4 rounded-xl bg-amber-950/20 text-xs text-amber-300">
                                    Analyzing answer and crafting Socratic questions...
                                  </div>
                                )}

                                {att.feedback && (
                                  <div className="space-y-4 pt-2 border-t border-stone-800">
                                    <div className="flex justify-between items-center p-3 rounded-xl bg-stone-900">
                                      <span className="text-xs text-stone-400">Approximate Grade:</span>
                                      <span className="text-base font-extrabold text-amber-400">{att.feedback.score}/10 — {att.feedback.scoreLabel}</span>
                                    </div>

                                    {/* Praise */}
                                    <div className="p-4 rounded-xl bg-emerald-950/30 border border-emerald-800/60 space-y-1.5">
                                      <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider block">
                                        ✓ What You Did Well!
                                      </span>
                                      <ul className="list-disc list-inside text-xs text-emerald-200 space-y-1">
                                        {att.feedback.praise.map((p, i) => <li key={i}>{p}</li>)}
                                      </ul>
                                    </div>

                                    {/* Socratic Questions */}
                                    <div className="p-4 rounded-xl bg-amber-950/30 border border-amber-800/60 space-y-1.5">
                                      <span className="text-xs font-bold text-amber-400 uppercase tracking-wider block">
                                        ? Questions to Deepen Your Thinking (What&rsquo;s Missing?)
                                      </span>
                                      <ul className="list-disc list-inside text-xs text-amber-200 space-y-1.5 leading-relaxed">
                                        {att.feedback.socraticQuestions.map((q, i) => <li key={i}>{q}</li>)}
                                      </ul>
                                    </div>

                                    {att.feedback.modelSuggestions && (
                                      <div className="p-3.5 rounded-xl bg-stone-900 text-xs text-stone-300 space-y-1">
                                        <span className="font-bold text-stone-400 block">Inspiration Sentence Idea:</span>
                                        <p className="italic text-stone-300">&ldquo;{att.feedback.modelSuggestions}&rdquo;</p>
                                      </div>
                                    )}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* TAB 5: THEORY TOOLKIT */}
            {activeTab === "concepts" && (
              <section className="rounded-3xl bg-stone-900 border border-stone-800 p-6 md:p-8 shadow-xl space-y-6 animate-fadeIn">
                <div className="pb-5 border-b border-stone-800">
                  <span className="inline-block px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider mb-2">
                    Curriculum Theory Toolkit
                  </span>
                  <h2 className="text-2xl md:text-3xl font-extrabold text-stone-100">
                    Dance Concepts &amp; Skills Reference
                  </h2>
                  <p className="text-sm text-stone-400 max-w-2xl mt-1 leading-relaxed">
                    The four official theory pillars required in your written exam analysis. Use these precise terms to demonstrate a discerning understanding.
                  </p>
                </div>

                <div className="space-y-8">
                  {DANCE_CONCEPTS.map(cat => (
                    <div key={cat.title} className="space-y-4">
                      <div>
                        <h3 className="text-lg font-bold text-stone-100">{cat.title}</h3>
                        <p className="text-xs text-stone-400">{cat.subtitle}</p>
                      </div>

                      {cat.groups.map(grp => (
                        <div key={grp.groupName} className="space-y-2.5">
                          <h4 className="text-xs font-bold text-stone-400 uppercase tracking-wider">{grp.groupName}</h4>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {grp.items.map(item => (
                              <div key={item.name} className="p-3.5 rounded-xl bg-stone-950 border border-stone-800 space-y-1">
                                <div className="text-xs font-bold text-stone-200">{item.name}</div>
                                <p className="text-xs text-stone-400 leading-relaxed">{item.def}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </section>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-stone-800 bg-stone-950 py-6 text-center text-xs text-stone-500 space-y-1">
            <p>Terrain (2012) choreographed by Frances Rings • Bangarra Dance Theatre Education Resource</p>
            <p>Study helper designed for Year 7–10 Dance Analysis and Exam Preparation.</p>
          </footer>

          {/* Gemini API Key Modal */}
          {isApiKeyModalOpen && (
            <ApiKeyModalComponent
              onClose={() => setIsApiKeyModalOpen(false)}
              onSaved={(key) => {
                setApiKey(key);
                setIsApiKeyModalOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // Modal subcomponent for index.html with automatic multi-model fallback test
    function ApiKeyModalComponent({ onClose, onSaved }) {
      const [val, setVal] = useState(getStoredApiKey());
      const [testing, setTesting] = useState(false);
      const [msg, setMsg] = useState("");
      const [isSuccess, setIsSuccess] = useState(false);

      const handleSave = async () => {
        const trimmed = val.trim();
        if (!trimmed) {
          setMsg("Please enter an API key.");
          return;
        }
        setTesting(true);
        setMsg("");
        setIsSuccess(false);

        try {
          await callGeminiApi(trimmed, "Hello! Reply with one word: Ready", false);
          storeApiKey(trimmed);
          setIsSuccess(true);
          setTimeout(() => {
            onSaved(trimmed);
          }, 800);
        } catch (e) {
          setMsg(e.message || "Could not verify key. Please check key format.");
        } finally {
          setTesting(false);
        }
      };

      const handleClear = () => {
        clearApiKey();
        setVal("");
        onSaved("");
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-md bg-stone-900 border border-stone-700 rounded-2xl p-6 text-stone-100 space-y-4">
            <div className="flex justify-between items-center pb-3 border-b border-stone-800">
              <h3 className="text-base font-bold">Google Gemini API Key</h3>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-200">✕</button>
            </div>

            <p className="text-xs text-stone-300 leading-relaxed">
              Your key is saved in a <strong>browser cookie</strong> so you only enter it once. It connects directly to Google Gemini from your browser.
            </p>

            <div>
              <label className="block text-[11px] font-semibold text-stone-400 mb-1">Enter Key:</label>
              <input
                type="text"
                value={val}
                onChange={e => { setVal(e.target.value); setMsg(""); }}
                placeholder="AQ.Ab8... or AIzaSy..."
                className="w-full px-3.5 py-2.5 rounded-xl bg-stone-950 border border-stone-700 text-xs text-stone-100 font-mono focus:border-amber-500 focus:outline-none"
              />
            </div>

            {testing && (
              <div className="text-xs text-amber-400 animate-pulse">
                Testing your Gemini key with Google servers...
              </div>
            )}

            {isSuccess && (
              <div className="text-xs text-emerald-400 bg-emerald-950/40 p-2.5 rounded-lg border border-emerald-800/60">
                ✓ Key successfully verified and saved in cookie!
              </div>
            )}

            {msg && (
              <div className="text-xs text-rose-400 bg-rose-950/40 p-2.5 rounded-lg border border-rose-800/60">
                {msg}
              </div>
            )}

            <div className="text-[11px] text-stone-400">
              Need a free key? Get one at <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-amber-400 underline">aistudio.google.com</a>
            </div>

            <div className="flex justify-between items-center pt-2 border-t border-stone-800">
              {val ? (
                <button onClick={handleClear} className="text-xs text-rose-400 hover:underline">Remove Key</button>
              ) : <span />}
              <div className="flex gap-2">
                <button onClick={onClose} className="px-3 py-1.5 rounded-lg text-xs text-stone-400">Cancel</button>
                <button
                  onClick={handleSave}
                  disabled={testing}
                  className="px-4 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 text-xs font-bold"
                >
                  {testing ? "Testing..." : "Save & Verify"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
